airbnb:
  outputs:
    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('DBT_USER') }}"

      role: TRANSFORM
      private_key: "{{ env_var('PRIVATE_KEY') }}"
      private_key_passphrase: "{{ env_var('PRIVATE_KEY_PASSPHRASE') }}"

      database: AIRBNB
      schema: DBT_{{ env_var('DBT_ENV_NAME')  | upper | trim}}"
      # threads: 1
      threads: 4
      warehouse: COMPUTE_WH
    staging:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('DBT_USER') | upper | trim}}"

      role: TRANSFORM
      private_key: "{{ env_var('PRIVATE_KEY') }}"
      private_key_passphrase: "{{ env_var('PRIVATE_KEY_PASSPHRASE') }}"

      database: AIRBNB
      schema: DBT_{{ env_var('DBT_ENV_NAME')  | upper | trim}}"
      # threads: 1
      threads: 4
      warehouse: COMPUTE_WH
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('DBT_USER')  | upper | trim}}"

      role: TRANSFORM
      private_key: "{{ env_var('PRIVATE_KEY') }}"
      private_key_passphrase: "{{ env_var('PRIVATE_KEY_PASSPHRASE') }}"

      database: AIRBNB
      schema: "DBT_{{ env_var('DBT_ENV_NAME')  | upper | trim}}"
      # threads: 1
      threads: 4
      warehouse: COMPUTE_WH
  target: dev # this is the default environment
