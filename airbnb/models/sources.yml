sources:
  - name: airbnb  # database
    schema: raw   # schema in db
    tables:
      - name: listings            # alias for table that you use in dbt
        identifier: raw_listings  # actual table name in db
        columns:
          - name: price
            data_tests:
              - dbt_expectations.expect_column_values_to_match_regex:
                  regex: ^\\$\\d+\\.\\d{2}
                  # row_condition: "id is not null" # (Optional)
                  # is_raw: True # (Optional)
                  # flags: i # (Optional)
          - name: room_type
            data_tests:
              - dbt_expectations.expect_column_distinct_count_to_equal:
                  value: 4
                  # quote_values: true # (Optional. Default is 'true'.)
                  # group_by: [group_id, other_group_id, ...] # (Optional)
                  # row_condition: "id is not null" # (Optional)



      - name: hosts
        identifier: raw_hosts

      - name: reviews
        identifier: raw_reviews
        config:
          loaded_at_field: date
          freshness:
            warn_after: {count: 1, period: hour}
            error_after: {count: 24, period: hour}